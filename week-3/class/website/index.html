    /* Tailwind 유틸리티로 표현하기 어려운 애니메이션·효과만 커스텀 */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: riseIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in { animation: fadeIn 0.2s ease-out both; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .pop-in { animation: popIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* 인스타그램 시그니처 그라디언트 */
    .ig-gradient {
      background: linear-gradient(110deg, #f9ce34 0%, #ee2a7b 45%, #6228d7 100%);
    }
    .ig-text {
      background: linear-gradient(110deg, #f9ce34 0%, #ee2a7b 45%, #a94ff5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* 카드 테두리에 그라디언트를 입히기 위한 마스크 트릭 */
    .ig-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(140deg, #f9ce34, #ee2a7b, #6228d7);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .ig-ring:hover::before { opacity: 1; }

    /* 배경 글로우 */
    .glow {

    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    html { scroll-behavior: smooth; }

    function formatLikes(n) {
      if (n === null || n === undefined) return '비공개';
      if (n >= 10000) {
        const man = n / 10000;
        return (man % 1 === 0 ? man.toFixed(0) : man.toFixed(1)) + '만';
      }
      return n.toLocaleString('ko-KR');
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      return `${y}.${m}.${d}`;
    }

    function postUrl(code) {

      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (

          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition

                      disabled:opacity-40 disabled:cursor-not-allowed
                      ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Badge({ tone = 'neutral', className = '', children }) {
      const tones = {
        neutral: 'bg-zinc-800/80 text-zinc-300 border-zinc-700',
        hot: 'bg-pink-500/15 text-pink-300 border-pink-500/40',
        fresh: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40',
        muted: 'bg-zinc-800/50 text-zinc-500 border-zinc-800',
      };
      return (
        <span className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-0.5
                          text-[11px] font-semibold tracking-tight ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-2xl border border-zinc-800 bg-zinc-900/60 backdrop-blur ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = prev;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl' };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 fade-in"
             role="dialog" aria-modal="true" aria-label={title}>
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          <div className={`relative w-full ${sizes[size]} max-h-[90vh] overflow-y-auto rounded-2xl
                           border border-zinc-800 bg-zinc-900 shadow-2xl pop-in`}>
            <div className="sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-zinc-800
                            bg-zinc-900/95 px-5 py-4 backdrop-blur">
              <h3 className="text-base font-bold text-zinc-100">{title}</h3>

                      className="shrink-0 rounded-lg p-1 text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-200">

                </svg>
              </button>
            </div>
            <div className="px-5 py-5">{children}</div>
          </div>
        </div>
      );
    }

              })}
            </div>

            <div className="flex shrink-0 items-center gap-1 rounded-xl border border-zinc-800 bg-zinc-900 p-1">
              {[{ id: 'likes', label: '인기순' }, { id: 'date', label: '최신순' }].map((s) => (
                <button
                  key={s.id}
                  onClick={() => onSortChange(s.id)}
                  aria-pressed={sort === s.id}
                  className={`rounded-lg px-3 py-1.5 text-xs font-semibold transition
                              ${sort === s.id ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-zinc-100'}`}
                >
                  {s.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ReelCard({ post, index, onOpen }) {
      const [loaded, setLoaded] = useState(false);

      return (
        <Card
          className="ig-ring rise-in group relative cursor-pointer overflow-hidden p-0 transition hover:-translate-y-1"
          style={{ animationDelay: `${Math.min(index, 12) * 0.04}s` }}
          onClick={() => onOpen(post)}
          role="button"
          tabIndex={0}
          aria-label={`${post.tag} · ${post.account} 게시물 상세 보기`}
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(post); } }}
        >
          <div className="relative aspect-[9/16] overflow-hidden bg-zinc-800">
            {!loaded && <div className="absolute inset-0 animate-pulse bg-zinc-800" />}
            <img
              src={thumbSrc(post.code)}
              alt={`${post.account}의 ${post.tag} 챌린지 릴스 썸네일`}
              loading="lazy"
              onLoad={() => setLoaded(true)}
              className={`h-full w-full object-cover transition duration-500 group-hover:scale-105
                          ${loaded ? 'opacity-100' : 'opacity-0'}`}
            />
            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/25 to-transparent" />

            {/* 게시일 — 재생 아이콘은 인스타 썸네일에 이미 박혀 있어 중복 표시하지 않는다 */}
            <div className="absolute right-2.5 top-2.5 rounded-lg bg-black/55 px-2 py-1 text-[10px]
                            font-bold tabular-nums text-white backdrop-blur">
              {formatDate(post.date)}
            </div>

            {post.isNew && (
              <div className="absolute left-2.5 top-2.5">
                <Badge tone="fresh">NEW</Badge>
              </div>
            )}

            <div className="absolute inset-x-0 bottom-0 p-3.5">
              <p className="truncate text-[11px] font-bold uppercase tracking-wide text-pink-400">{post.tag}</p>
              <p className="mt-1 line-clamp-2 text-sm font-semibold leading-snug text-white">{post.caption}</p>
              <div className="mt-2.5 flex items-center justify-between gap-2 text-[11px]">
                <span className="truncate font-medium text-zinc-300">@{post.account}</span>
                <span className="flex shrink-0 items-center gap-1 font-bold text-white">
                  <svg className="h-3 w-3 text-pink-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                  </svg>
                  {formatLikes(post.likes)}
                </span>
              </div>
            </div>
          </div>
        </Card>
      );
    }

    function GallerySection({ posts, active, onChange, sort, onSortChange, counts, onOpen }) {
      return (
        <section id="gallery" className="mx-auto max-w-6xl px-5 pb-16 pt-4">
          <SectionTitle
            eyebrow="갤러리"
            title="챌린지별 게시물"
            desc="카드를 누르면 상세 정보가 열리고, 원본 인스타그램 게시물로 바로 이동할 수 있습니다."
          />
          <div className="mt-6">
            <FilterBar
              active={active} onChange={onChange}
              sort={sort} onSortChange={onSortChange}
              counts={counts}
            />

            {posts.length === 0 ? (
              <Card className="px-6 py-16 text-center">
                <p className="text-4xl">🔍</p>
                <p className="mt-4 font-semibold text-zinc-300">해당 카테고리에 게시물이 없습니다</p>
                <p className="mt-1 text-sm text-zinc-500">다른 필터를 선택해 보세요.</p>
              </Card>
            ) : (
              <div className="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
                {posts.map((p, i) => (
                  <ReelCard key={p.code} post={p} index={i} onOpen={onOpen} />
                ))}
              </div>
            )}
          </div>
        </section>
      );
    }

    function DetailModal({ post, onClose }) {
      if (!post) return null;
      const catLabel = (CATEGORIES.find((c) => c.id === post.cat) || {}).label || '';

      return (
        <Modal isOpen={!!post} onClose={onClose} title={post.tag} size="md">
          <div className="grid gap-6 sm:grid-cols-[200px_1fr]">
            <a href={postUrl(post.code)} target="_blank" rel="noopener noreferrer"
               className="group relative block overflow-hidden rounded-xl border border-zinc-800">
              <div className="aspect-[9/16] bg-zinc-800">
                <img src={thumbSrc(post.code)}
                     alt={`${post.account}의 ${post.tag} 챌린지 릴스 썸네일`}
                     className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
              </div>
              <div className="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 transition group-hover:opacity-100">
                <span className="rounded-full bg-white/95 px-3 py-1.5 text-xs font-bold text-zinc-900">
                  인스타그램에서 보기
                </span>
              </div>
            </a>

            <div className="min-w-0">
              <div className="flex flex-wrap gap-2">
                <Badge tone="hot">{catLabel}</Badge>
                {post.isNew && <Badge tone="fresh">NEW · 신규 트렌드</Badge>}
              </div>

              <p className="mt-4 text-base font-semibold leading-relaxed text-zinc-100">
                “{post.caption}”
              </p>
              <p className="mt-2 text-sm leading-relaxed text-zinc-400">{post.note}</p>

              <dl className="mt-6 space-y-3 border-t border-zinc-800 pt-5 text-sm">
                {[
                  { k: '계정', v: '@' + post.account },
                  { k: '게시일', v: formatDate(post.date) },
                  { k: '좋아요', v: formatLikes(post.likes) },
                  { k: '게시물 코드', v: post.code },
                ].map((row) => (
                  <div key={row.k} className="flex items-center justify-between gap-4">
                    <dt className="shrink-0 text-zinc-500">{row.k}</dt>
                    <dd className="truncate font-semibold text-zinc-200">{row.v}</dd>
                  </div>
                ))}
              </dl>

              <div className="mt-6 flex flex-wrap gap-2">
                <Button size="md" onClick={() => window.open(postUrl(post.code), '_blank', 'noopener')}>
                  게시물 열기
                  <svg className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round"
                          d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                  </svg>
                </Button>
                <Button variant="secondary" size="md"
                        onClick={() => window.open('https://www.instagram.com/' + post.account + '/', '_blank', 'noopener')}>
                  계정 방문
                </Button>
              </div>
            </div>
          </div>
        </Modal>
      );
    }

    function InsightSection() {
      const insights = [
        { icon: '🎯', title: '지금 잡아야 할 것', body: 'GUAP — 8월 내내 검색 결과를 지배 중이며 아직 소진되지 않았습니다.' },
        { icon: '🛡️', title: '가장 안전한 선택', body: 'I WANT YOU BACK — 아이돌·일반인 양쪽에서 두 달 넘게 지속. 원곡 서사까지 있어 콘텐츠 확장성이 좋습니다.' },
        { icon: '🚀', title: '선점 노릴 것', body: "TUIDE 'GRLS' — 8/30 등장한 신규 건으로 아직 게시물 수가 적습니다." },
        { icon: '📈', title: '성과 1위의 공식', body: '@big__bari 19.7만 — 챌린지 자체보다 「낚시 → 반전」 구성이 주효했습니다.' },
      ];
      return (
        <section className="border-t border-zinc-800 bg-zinc-900/30">
          <div className="mx-auto max-w-6xl px-5 py-14">
            <SectionTitle eyebrow="정리" title="리서치 인사이트" />
            <div className="mt-8 grid gap-4 sm:grid-cols-2">
              {insights.map((it) => (
                <Card key={it.title} className="p-6">
                  <div className="text-2xl">{it.icon}</div>
                  <h3 className="mt-3 font-bold tracking-tight text-zinc-100">{it.title}</h3>
                  <p className="mt-2 text-sm leading-relaxed text-zinc-400">{it.body}</p>
                </Card>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="border-t border-zinc-800">
          <div className="mx-auto max-w-6xl px-5 py-12">
            <h3 className="flex items-center gap-2 text-sm font-bold text-zinc-300">
              <span aria-hidden="true">⚠️</span> 데이터 한계
            </h3>
            <ul className="mt-4 space-y-2">
              {LIMITATIONS.map((l, i) => (
                <li key={i} className="flex gap-2.5 text-sm leading-relaxed text-zinc-500">
                  <span className="mt-2 h-1 w-1 shrink-0 rounded-full bg-zinc-700" aria-hidden="true" />
                  {l}
                </li>
              ))}
            </ul>
            <p className="mt-8 border-t border-zinc-800 pt-6 text-xs text-zinc-600">
              Instagram 검색 탭 '{RESEARCH_META.keyword}' 키워드 기준 · {RESEARCH_META.collectedAt} 수집 ·
              썸네일 {RESEARCH_META.selected}종은 <code className="text-zinc-500">thumbs/</code> 폴더에 로컬 저장되어 CDN 만료와 무관하게 유지됩니다.
            </p>
          </div>
        </footer>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [active, setActive] = useState('all');
      const [sort, setSort] = useState('likes');
      const [selected, setSelected] = useState(null);

      const counts = useMemo(() => {
        const c = { all: POSTS.length };
        CATEGORIES.forEach((cat) => {
          if (cat.id !== 'all') c[cat.id] = POSTS.filter((p) => p.cat === cat.id).length;
        });
        return c;
      }, []);

      const visible = useMemo(() => {
        const list = active === 'all' ? [...POSTS] : POSTS.filter((p) => p.cat === active);
        return list.sort((a, b) =>
          sort === 'likes'
            ? (b.likes ?? -1) - (a.likes ?? -1)
            : b.date.localeCompare(a.date)
        );
      }, [active, sort]);

      const jumpTo = useCallback((cat) => {
        setActive(cat);
        const el = document.getElementById('gallery');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      return (
        <div className="min-h-screen">
          <Hero />
          <RankingSection onJump={jumpTo} />
          <GallerySection
            posts={visible}
            active={active}
            onChange={setActive}
            sort={sort}
            onSortChange={setSort}
            counts={counts}
            onOpen={setSelected}
          />
          <InsightSection />
          <Footer />
          <DetailModal post={selected} onClose={() => setSelected(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
