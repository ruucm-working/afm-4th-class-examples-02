function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ':' + String(s).padStart(2, '0');
}

// 검색어와 일치하는 부분을 하이라이트
function highlight(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return (
    <>
      {text.slice(0, idx)}
      <mark className="bg-transparent font-bold text-brand">{text.slice(idx, idx + query.length)}</mark>
      {text.slice(idx + query.length)}
    </>
  );
}

// 체크 상태를 이 브라우저에 기억 (저장 불가여도 앱은 정상 동작)
function useStoredSet(key) {
  const [set, setSet] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) { return new Set(); }
  });

  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify([...set])); } catch (e) { /* noop */ }
  }, [key, set]);

  const toggle = useCallback((id) => {
    setSet((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }, []);

  return [set, toggle];
}

                          {item.verified ? '✓ ' : ''}{item.note}
                        </span>
                      )}
                    </CheckItem>
                  </li>
                );
              })}
            </ul>
          </div>
        ))}
      </div>
    </Panel>
  );
}

function StepTimer({ seconds, stepLabel }) {
  const [remaining, setRemaining] = useState(seconds);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    if (!running) return undefined;
    const id = setInterval(() => setRemaining((r) => Math.max(0, r - 1)), 1000);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    if (remaining === 0 && running) setRunning(false);
  }, [remaining, running]);

  const finished = remaining === 0;

  return (
    <div className="mt-2 flex items-center gap-2">
      <span
        aria-live="polite"
        aria-label={stepLabel + ' 남은 시간'}
        className={`font-mono text-sm tabular-nums ${finished ? 'text-brand' : running ? 'text-ink' : 'text-ink-mute'}`}
      >
        {formatClock(remaining)}
      </span>
      {finished ? (
        <Badge>완료</Badge>
      ) : (
        <Button size="sm" variant={running ? 'secondary' : 'primary'} onClick={() => setRunning((r) => !r)}>
          {running ? '일시정지' : '타이머 시작'}
        </Button>
      )}
      {(running || remaining !== seconds) && (
        <Button size="sm" variant="ghost" onClick={() => { setRemaining(seconds); setRunning(false); }} aria-label="타이머 초기화">↺</Button>
      )}
    </div>
  );
}

function StepsPanel() {
  const [done, toggle] = useStoredSet('portal:steps');

  return (

      title="만드는 법"

      more={'총 ' + RECIPE.time}
      bodyClassName="divide-y divide-line"
    >
      {STEPS.map((step) => {
        const isDone = done.has(String(step.n));
        return (
          <article key={step.n} className="flex gap-3 p-4">
            <button

              aria-pressed={isDone}
              aria-label={step.n + '단계 ' + step.title + (isDone ? ' 완료 취소' : ' 완료 표시')}

                isDone ? 'bg-brand text-white' : 'bg-brand-light text-brand-dark hover:bg-brand hover:text-white'

            </button>
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-2">
                <h3 className={`text-sm font-bold ${isDone ? 'text-ink-mute line-through' : 'text-ink'}`}>{step.title}</h3>
                <span className="text-xs text-ink-mute">{step.minutes}분</span>
              </div>
              <p className="mt-1 text-[13px] leading-relaxed text-ink-sub">{step.body}</p>
              <StepTimer seconds={step.minutes * 60} stepLabel={step.n + '단계 ' + step.title} />

function SearchResultsPanel({ query, onClear }) {
  const results = useMemo(() => {
    const q = query.toLowerCase();
    return SEARCH_INDEX.filter(
      (item) => item.title.toLowerCase().includes(q) || item.body.toLowerCase().includes(q) || item.category.toLowerCase().includes(q)
    );
  }, [query]);

  return (
    <Panel
      title={'‘' + query + '’ 검색결과'}
      badge={<Badge tone="gray">{results.length}건</Badge>}
      more={<button onClick={onClear} className="text-xs text-brand hover:underline">전체 보기</button>}
      bodyClassName={results.length ? 'divide-y divide-line' : 'p-8'}
    >
      {results.length === 0 ? (
        <div className="text-center">
          <p className="text-sm text-ink-sub">검색 결과가 없습니다.</p>
          <p className="mt-1 text-xs text-ink-mute">재료명이나 조리 단계 이름으로 다시 검색해 보세요.</p>
          <Button variant="secondary" size="sm" className="mt-3" onClick={onClear}>전체 레시피 보기</Button>
        </div>
      ) : (
        results.map((r, i) => (
          <a key={i} href={r.href} className="block px-4 py-3 transition-colors hover:bg-canvas">
            <p className="text-[11px] text-brand">{r.category}</p>
            <h3 className="mt-0.5 text-sm font-bold text-ink">{highlight(r.title, query)}</h3>
            <p className="mt-0.5 line-clamp-2 text-[13px] text-ink-sub">{highlight(r.body, query)}</p>
          </a>
        ))
      )}
    </Panel>
  );
}

const RANK_MARK = { up: { text: '▲', className: 'text-red-500' }, down: { text: '▼', className: 'text-blue-500' }, same: { text: '–', className: 'text-ink-mute' } };

function TrendingBox({ onPick }) {
  const [page, setPage] = useState(0);
  const [paused, setPaused] = useState(false);
  const pageSize = 5;
  const pageCount = Math.ceil(TRENDING.length / pageSize);

  useEffect(() => {
    if (paused) return undefined;
    const id = setInterval(() => setPage((p) => (p + 1) % pageCount), 4000);
    return () => clearInterval(id);
  }, [paused, pageCount]);

  const items = TRENDING.slice(page * pageSize, page * pageSize + pageSize);

  return (
    <Panel
      title="실시간 급상승 팁"
      more={page + 1 + ' / ' + pageCount}
      bodyClassName="p-2"
    >
      <ul
        onMouseEnter={() => setPaused(true)}
        onMouseLeave={() => setPaused(false)}
        onFocus={() => setPaused(true)}
        onBlur={() => setPaused(false)}
      >
        {items.map((t, i) => {
          const rank = page * pageSize + i + 1;
          const mark = RANK_MARK[t.state];
          return (
            <li key={t.word} className="roll-in">
              <button
                onClick={() => onPick(t.word)}
                className="flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left transition-colors hover:bg-canvas"
              >
                <span className={`w-3 text-center text-xs font-bold ${rank <= 3 ? 'text-brand' : 'text-ink-mute'}`}>{rank}</span>
                <span className="min-w-0 flex-1 truncate text-[13px] text-ink">{t.word}</span>
                <span className={`text-[10px] ${mark.className}`} aria-hidden="true">{mark.text}</span>
              </button>
            </li>
          );
        })}
      </ul>
      <p className="px-2 pb-1 pt-2 text-[11px] text-ink-mute">
        {paused ? '자동 롤링 일시정지' : '4초마다 자동 롤링'}
      </p>
    </Panel>
  );
}

// ========================================
// 🚀 App Component
// ========================================

const TABS = [
  { id: 'all', label: '전체' },
  { id: 'ingredients', label: '재료' },
  { id: 'steps', label: '만드는 법' },
  { id: 'tips', label: '팁' },
];

function App() {
  const [query, setQuery] = useState('');
  const [tab, setTab] = useState('all');
  const mainRef = useRef(null);

  const search = useCallback((q) => {
    setQuery(q);
    if (q && mainRef.current) mainRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, []);

  const showAll = tab === 'all';

  return (
    <div className="min-h-screen bg-canvas font-sans text-ink antialiased">
      <TopBar />
      <SearchHeader query={query} onSubmit={search} />
      <Shortcuts />

      <main ref={mainRef} className="mx-auto max-w-[1130px] scroll-mt-4 px-5 py-5">
        <div className="grid gap-5 lg:grid-cols-[1fr_320px]">
          {/* 메인 컬럼 */}
          <div className="space-y-5">
            {query ? (
              <SearchResultsPanel query={query} onClear={() => setQuery('')} />
            ) : (
              <>
                <HeroPanel />
                <div className="overflow-hidden rounded-xl border border-line bg-white">
                  <Tabs tabs={TABS} active={tab} onChange={setTab} />
                </div>
                {(showAll || tab === 'ingredients') && <IngredientsPanel />}
                {(showAll || tab === 'steps') && <StepsPanel />}
                {(showAll || tab === 'tips') && <TipsPanel />}
                {showAll && <PairingsPanel />}
                {showAll && <LogPanel />}
              </>
            )}
          </div>

          {/* 사이드바 */}
          <aside className="space-y-5">
            <TodayBox />
            <TrendingBox onPick={search} />
            <ShoppingBox />
          </aside>
        </div>
      </main>

      <Footer />
    </div>
  );
}

// ========================================
// Rendering
// ========================================

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
