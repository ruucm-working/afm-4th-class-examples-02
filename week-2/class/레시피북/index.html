const FRACTIONS = { 0.25: '¼', 0.33: '⅓', 0.5: '½', 0.67: '⅔', 0.75: '¾' };

function formatAmount(value) {
  if (value == null) return '';
  const rounded = Math.round(value * 100) / 100;
  const whole = Math.floor(rounded);
  const frac = Math.round((rounded - whole) * 100) / 100;
  const symbol = FRACTIONS[frac];
  if (!symbol) return String(rounded);
  return whole > 0 ? whole + symbol : symbol;
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ':' + String(s).padStart(2, '0');
}

// **강조** 표기를 굵은 텍스트로 렌더링
function renderEmphasis(text) {
  return text.split(/(\*\*[^*]+\*\*)/g).map((chunk, i) =>
    chunk.startsWith('**') && chunk.endsWith('**')
      ? <strong key={i} className="font-semibold text-amber-300">{chunk.slice(2, -2)}</strong>
      : <React.Fragment key={i}>{chunk}</React.Fragment>
  );
}

// 타이머 종료 알림음 (미지원 환경에서는 조용히 무시)
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [0, 0.28].forEach((offset) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + offset);
      osc.stop(ctx.currentTime + offset + 0.24);
    });
    setTimeout(() => ctx.close(), 1200);
  } catch (e) { /* noop */ }
}

// 체크 상태를 이 브라우저에 기억 (저장 불가여도 앱은 정상 동작)
function useStoredSet(key) {
  const [set, setSet] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) { return new Set(); }
  });

  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify([...set])); } catch (e) { /* noop */ }
  }, [key, set]);

  const toggle = useCallback((id) => {
    setSet((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }, []);

  const clear = useCallback(() => setSet(new Set()), []);

  return [set, toggle, clear];
}

function StepTimer({ seconds, stepLabel }) {
  const [remaining, setRemaining] = useState(seconds);
  const [running, setRunning] = useState(false);
  const alertedRef = useRef(false);

  useEffect(() => {
    if (!running) return undefined;
    const id = setInterval(() => setRemaining((r) => Math.max(0, r - 1)), 1000);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    if (remaining === 0 && running) {
      setRunning(false);
      if (!alertedRef.current) { alertedRef.current = true; beep(); }
    }
  }, [remaining, running]);

  const reset = () => {
    setRemaining(seconds);
    setRunning(false);
    alertedRef.current = false;
  };
  const finished = remaining === 0;

  return (
    <div className={`inline-flex items-center gap-2 rounded-xl border px-3 py-2 ${
      finished
        ? 'border-emerald-500/40 bg-emerald-500/10'
        : running
        ? 'ring-pulse border-amber-500/40 bg-amber-500/10'
        : 'border-stone-700 bg-stone-800/50'
    }`}>
      <span
        aria-live="polite"
        aria-label={stepLabel + ' 남은 시간'}
        className={`font-mono text-lg tabular-nums ${finished ? 'text-emerald-300' : running ? 'text-amber-300' : 'text-stone-300'}`}
      >
        {formatClock(remaining)}
      </span>
      {finished ? (
        <span className="text-xs font-medium text-emerald-300">완료!</span>
      ) : (
        <Button size="sm" variant={running ? 'secondary' : 'primary'} onClick={() => setRunning((r) => !r)}>
          {running ? '일시정지' : '시작'}
        </Button>
      )}
      {(running || remaining !== seconds) && (
        <Button size="sm" variant="ghost" onClick={reset} aria-label="타이머 초기화">↺</Button>
      )}
    </div>
  );
}

                    <p className="mt-1.5 text-sm leading-relaxed text-stone-300">{renderEmphasis(step.body)}</p>
                    <div className="no-print mt-3">
                      <StepTimer seconds={step.minutes * 60} stepLabel={step.n + '단계 ' + step.title} />
                    </div>
                  </div>
                </div>
              </Card>
            </li>
          );
        })}
      </ol>
    </section>
  );
}

function TipsSection() {
  return (
    <section className="px-4 py-10">
      <SectionTitle id="tips" eyebrow="Tips">팁</SectionTitle>
      <div className="grid gap-3 sm:grid-cols-2">
        {TIPS.map((tip) => (

        <table className="w-full text-sm">

                  <dd className="text-sm text-stone-400">{d.v}</dd>

// ========================================
// 🚀 App Component
// ========================================

function App() {
  const [multiplier, setMultiplier] = useState(1);
  const [activeSection, setActiveSection] = useState(SECTIONS[0].id);

  // 스크롤 위치에 따라 현재 섹션을 상단 내비게이션에 표시
  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries.filter((e) => e.isIntersecting);
        if (visible.length > 0) setActiveSection(visible[0].target.id);
      },
      { rootMargin: '-72px 0px -65% 0px', threshold: 0 }
    );
    SECTIONS.forEach((s) => {
      const el = document.getElementById(s.id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return (
    <div className="min-h-screen bg-stone-950 text-stone-200 antialiased">
      <Hero />
      <Header activeSection={activeSection} />
      <main className="mx-auto max-w-3xl divide-y divide-stone-800/70">
        <p className="px-4 py-8 text-base leading-relaxed text-stone-400 sm:text-lg">{RECIPE.tagline}</p>
        <IngredientsSection multiplier={multiplier} onMultiplierChange={setMultiplier} />
        <StepsSection />
        <TipsSection />
        <PairingsSection />
        <LogSection />
      </main>
      <Footer />
    </div>
  );
}

// ========================================
// Rendering
// ========================================

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
