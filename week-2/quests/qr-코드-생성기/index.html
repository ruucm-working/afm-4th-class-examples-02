<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR 코드 생성기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <!-- QR 인코딩: 전역 qrcode() 함수를 노출한다 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가한 것만 */
    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    .animate-pop-in { animation: pop-in 0.25s ease-out; }

    /* 색상 입력의 네이티브 크롬 제거 */
    input[type="color"] { -webkit-appearance: none; appearance: none; padding: 0; border: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50',
        danger: 'bg-rose-600 text-white hover:bg-rose-700',
        ghost: 'bg-transparent text-slate-500 hover:bg-slate-200/70',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, hint, className = '', ...rest }) {
      const id = useMemo(() => `input-${Math.random().toString(36).slice(2, 9)}`, []);
      return (
        <div className={className}>
          {label && (
            <label htmlFor={id} className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</label>
          )}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 transition-colors focus:outline-none focus:ring-2 disabled:bg-slate-100 ${
              error
                ? 'border-rose-400 focus:border-rose-500 focus:ring-rose-200'
                : 'border-slate-300 focus:border-indigo-500 focus:ring-indigo-200'
            }`}
            {...rest}
          />
          {error && <p id={`${id}-error`} className="mt-1.5 text-xs font-medium text-rose-600">{error}</p>}
          {!error && hint && <p className="mt-1.5 text-xs text-slate-400">{hint}</p>}
        </div>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/70 p-6 sm:p-8 ${className}`}>
          {children}
        </div>
      );
    }

    function Select({ label, value, onChange, options, hint, className = '' }) {
      const id = useMemo(() => `select-${Math.random().toString(36).slice(2, 9)}`, []);
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</label>}
          <select
            id={id}
            value={value}
            onChange={onChange}
            className="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          >
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
          {hint && <p className="mt-1.5 text-xs text-slate-400">{hint}</p>}
        </div>
      );
    }

    function ColorField({ label, value, onChange }) {
      return (
        <div>
          <label className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</label>
          <div className="flex items-center gap-2 rounded-xl border border-slate-300 bg-white p-1.5">
            <input
              type="color"
              value={value}
              onChange={onChange}
              aria-label={label}
              className="h-9 w-10 shrink-0 cursor-pointer rounded-lg"
            />
            <span className="font-mono text-xs uppercase text-slate-500">{value}</span>
          </div>
        </div>
      );
    }

    function Badge({ tone = 'slate', children }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-600',
        green: 'bg-emerald-100 text-emerald-700',
        rose: 'bg-rose-100 text-rose-700',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ${tones[tone]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================

    function Header() {
      return (
        <header className="text-center mb-8">
          <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 shadow-lg shadow-indigo-600/25">
            <svg className="h-7 w-7 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zM13 3h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zM13 13h3v3h-3v-3zm5 0h3v3h-3v-3zm-5 5h3v3h-3v-3zm5 0h3v3h-3v-3z"/>
            </svg>
          </div>
          <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">QR 코드 생성기</h1>
          <p className="mt-2 text-sm sm:text-base text-slate-500">
            웹사이트 주소를 입력하면 바로 QR 코드로 만들어 드려요.
          </p>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="mt-10 text-center text-xs text-slate-400">
          <p>모든 처리는 브라우저 안에서만 이루어집니다. 입력한 주소는 어디에도 전송되지 않아요.</p>
        </footer>
      );
    }

    // ========================================
    // 🔧 QR 도메인 로직
    // ========================================

    const STORAGE_KEY = 'qr-generator:history';
    const MAX_HISTORY = 6;

    const EC_OPTIONS = [
      { value: 'L', label: '낮음 (L · 약 7% 복원)' },
      { value: 'M', label: '보통 (M · 약 15% 복원)' },
      { value: 'Q', label: '높음 (Q · 약 25% 복원)' },
      { value: 'H', label: '아주 높음 (H · 약 30% 복원)' },
    ];

    const SIZE_OPTIONS = [
      { value: '256', label: '작게 (256px)' },
      { value: '512', label: '보통 (512px)' },
      { value: '1024', label: '크게 (1024px)' },
    ];

    // "naver.com" 처럼 스킴 없이 입력해도 https:// 를 자동으로 붙여준다
    function normalizeUrl(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return '';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function validateUrl(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return { valid: false, error: null, url: '' };

      const normalized = normalizeUrl(trimmed);
      let parsed;
      try {
        parsed = new URL(normalized);
      } catch (e) {
        return { valid: false, error: '올바른 주소 형식이 아니에요. 예) https://www.naver.com', url: '' };
      }
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        // 점 없는 호스트(localhost 제외)는 아직 입력이 덜 끝났거나 오타일 가능성이 높다
        if (!parsed.hostname.includes('.') && parsed.hostname !== 'localhost') {
          return { valid: false, error: '도메인이 완전하지 않아요. 예) example.com', url: '' };
        }
      }
      return { valid: true, error: null, url: normalized };
    }

    // 한글이 섞인 주소도 깨지지 않도록 UTF-8 인코더를 지정 (기본값은 UTF-8 이 아니다)
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

    // 데이터가 너무 길면 qrcode() 가 예외를 던지므로 호출부에서 try/catch 한다
    function encodeQr(text, ecLevel) {
      const qr = qrcode(0, ecLevel); // 0 = 데이터 길이에 맞춰 버전 자동 선택
      qr.addData(text);
      qr.make();
      return qr;
    }

    function drawQrToCanvas(canvas, qr, { size, margin, dark, light }) {
      const count = qr.getModuleCount();
      const total = count + margin * 2;
      // 모듈이 소수점 픽셀에 걸치면 흐려지므로 정수 셀 크기로 맞춘다
      const cell = Math.max(1, Math.floor(size / total));
      const dimension = cell * total;

      canvas.width = dimension;
      canvas.height = dimension;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = light;
      ctx.fillRect(0, 0, dimension, dimension);
      ctx.fillStyle = dark;
      for (let row = 0; row < count; row++) {
        for (let col = 0; col < count; col++) {
          if (qr.isDark(row, col)) {
            ctx.fillRect((col + margin) * cell, (row + margin) * cell, cell, cell);
          }
        }
      }
    }

    function buildSvgString(qr, { size, margin, dark, light }) {
      const count = qr.getModuleCount();
      const total = count + margin * 2;
      let path = '';
      for (let row = 0; row < count; row++) {
        for (let col = 0; col < count; col++) {
          if (qr.isDark(row, col)) {
            path += `M${col + margin},${row + margin}h1v1h-1z`;
          }
        }
      }
      return [
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"`,
        ` viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges">`,
        `<rect width="${total}" height="${total}" fill="${light}"/>`,
        `<path d="${path}" fill="${dark}"/>`,
        `</svg>`,
      ].join('');
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    function QrPreview({ url, size, ecLevel, darkColor, lightColor, margin }) {
      const canvasRef = useRef(null);

      // 인코딩은 주소·보정수준에만 의존한다. 색상이나 크기를 바꿀 때는 다시 계산할 필요가 없다
      const { qr, encodeError } = useMemo(() => {
        if (!url) return { qr: null, encodeError: null };
        try {
          return { qr: encodeQr(url, ecLevel), encodeError: null };
        } catch (e) {
          return { qr: null, encodeError: '주소가 너무 길어서 QR 코드로 만들 수 없어요. 오류 보정 수준을 낮춰 보세요.' };
        }
      }, [url, ecLevel]);

      const renderOptions = useMemo(
        () => ({ size: Number(size), margin, dark: darkColor, light: lightColor }),
        [size, margin, darkColor, lightColor]
      );

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !qr) return;
        drawQrToCanvas(canvas, qr, renderOptions);
      }, [qr, renderOptions]);

      const download = useCallback((format) => {
        if (!qr) return;
        const filename = `qrcode-${Date.now()}.${format}`;
        const link = document.createElement('a');
        link.download = filename;

        if (format === 'png') {
          const canvas = canvasRef.current;
          if (!canvas) return;
          link.href = canvas.toDataURL('image/png');
          link.click();
          return;
        }

        const blob = new Blob([buildSvgString(qr, renderOptions)], { type: 'image/svg+xml' });
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
      }, [qr, renderOptions]);

      return (
        <div className="flex flex-col items-center">
          <div
            className="flex aspect-square w-full max-w-[300px] items-center justify-center rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 p-4"
            aria-live="polite"
          >
            {qr ? (
              <canvas
                ref={canvasRef}
                role="img"
                aria-label={`${url} 의 QR 코드`}
                className="animate-pop-in h-full w-full rounded-lg object-contain"
              />
            ) : (
              /* Empty state */
              <div className="px-4 text-center">
                <svg className="mx-auto h-10 w-10 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" rx="1" />
                  <rect x="14" y="3" width="7" height="7" rx="1" />
                  <rect x="3" y="14" width="7" height="7" rx="1" />
                  <path d="M14 14h3v3h-3zM19 19h2v2h-2zM14 19h2v2h-2zM19 14h2v2h-2z" />
                </svg>
                <p className="mt-3 text-sm text-slate-400">
                  {encodeError ? '만들 수 없는 주소예요' : <React.Fragment>주소를 입력하면<br />여기에 QR 코드가 나타나요</React.Fragment>}
                </p>
              </div>
            )}
          </div>

          {encodeError && (
            <p className="mt-3 text-center text-xs font-medium text-rose-600">{encodeError}</p>
          )}

          <div className="mt-5 flex w-full max-w-[300px] gap-2">
            <Button variant="primary" size="md" disabled={!qr} onClick={() => download('png')} className="flex-1">
              <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
              PNG 저장
            </Button>
            <Button variant="secondary" size="md" disabled={!qr} onClick={() => download('svg')} className="flex-1">
              SVG 저장
            </Button>
          </div>
        </div>
      );
    }

    function HistoryList({ items, onSelect, onClear }) {
      if (items.length === 0) return null;

      return (
        <div className="mt-8 border-t border-slate-200 pt-6">
          <div className="mb-3 flex items-center justify-between">
            <h2 className="text-sm font-semibold text-slate-700">최근 만든 QR 코드</h2>
            <Button variant="ghost" size="sm" onClick={onClear}>전체 삭제</Button>
          </div>
          <ul className="flex flex-wrap gap-2">
            {items.map((item) => (
              <li key={item}>
                <button
                  type="button"
                  onClick={() => onSelect(item)}
                  title={item}
                  className="max-w-[240px] truncate rounded-full bg-slate-100 px-3.5 py-1.5 text-xs font-medium text-slate-600 transition-colors hover:bg-indigo-50 hover:text-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                >
                  {item.replace(/^https?:\/\//, '')}
                </button>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function QrGeneratorPage() {
      const [rawInput, setRawInput] = useState('');
      const [size, setSize] = useState('512');
      const [ecLevel, setEcLevel] = useState('M');
      const [darkColor, setDarkColor] = useState('#0f172a');
      const [lightColor, setLightColor] = useState('#ffffff');
      const [showOptions, setShowOptions] = useState(false);
      const [copied, setCopied] = useState(false);
      const [history, setHistory] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });

      // 입력이 멈춘 뒤에만 검증한다 — 타이핑 도중 에러 메시지가 깜빡이지 않도록
      const [debounced, setDebounced] = useState('');
      useEffect(() => {
        const timer = setTimeout(() => setDebounced(rawInput), 400);
        return () => clearTimeout(timer);
      }, [rawInput]);

      const { valid, error, url } = useMemo(() => validateUrl(debounced), [debounced]);

      // 유효한 주소가 확정되면 기록에 남긴다
      useEffect(() => {
        if (!valid || !url) return;
        setHistory((prev) => {
          const next = [url, ...prev.filter((u) => u !== url)].slice(0, MAX_HISTORY);
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch (e) { /* 저장 공간이 없어도 앱은 계속 동작해야 한다 */ }
          return next;
        });
      }, [valid, url]);

      useEffect(() => {
        if (!copied) return;
        const timer = setTimeout(() => setCopied(false), 1800);
        return () => clearTimeout(timer);
      }, [copied]);

      const handleCopy = useCallback(() => {
        if (!url) return;
        navigator.clipboard.writeText(url).then(() => setCopied(true)).catch(() => {});
      }, [url]);

      const clearHistory = useCallback(() => {
        setHistory([]);
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) { /* noop */ }
      }, []);

      const selectFromHistory = useCallback((item) => {
        setRawInput(item);
        setDebounced(item);
      }, []);

      const resetOptions = useCallback(() => {
        setSize('512');
        setEcLevel('M');
        setDarkColor('#0f172a');
        setLightColor('#ffffff');
      }, []);

      return (
        <div className="mx-auto w-full max-w-4xl px-4 py-10 sm:py-14">
          <Header />

          <Card>
            <div className="grid gap-8 lg:grid-cols-[1fr_320px]">
              {/* 입력 영역 */}
              <div>
                <Input
                  type="text"
                  label="웹사이트 주소"
                  value={rawInput}
                  onChange={(e) => setRawInput(e.target.value)}
                  placeholder="https://www.example.com"
                  error={error}
                  hint="https:// 를 빼고 입력해도 자동으로 붙여 드려요."
                  autoFocus
                  spellCheck="false"
                  autoComplete="url"
                  inputMode="url"
                />

                <div className="mt-3 flex min-h-[32px] flex-wrap items-center gap-2">
                  {valid && (
                    <React.Fragment>
                      <Badge tone="green">인식 완료</Badge>
                      <span className="max-w-full truncate font-mono text-xs text-slate-500">{url}</span>
                      <Button variant="ghost" size="sm" onClick={handleCopy}>
                        {copied ? '복사됨!' : '주소 복사'}
                      </Button>
                    </React.Fragment>
                  )}
                  {rawInput.trim() && !valid && !error && (
                    <span className="text-xs text-slate-400">확인 중…</span>
                  )}
                </div>

                {/* 자세한 설정 */}
                <div className="mt-5">
                  <button
                    type="button"
                    onClick={() => setShowOptions((v) => !v)}
                    aria-expanded={showOptions}
                    className="inline-flex items-center gap-1.5 rounded text-sm font-semibold text-indigo-600 hover:text-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                  >
                    <svg
                      className={`h-4 w-4 transition-transform ${showOptions ? 'rotate-90' : ''}`}
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" aria-hidden="true"
                    >
                      <path d="M9 5l7 7-7 7" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                    자세한 설정
                  </button>

                  {showOptions && (
                    <div className="mt-4 grid gap-4 rounded-2xl bg-slate-50 p-5 sm:grid-cols-2">
                      <Select
                        label="이미지 크기"
                        value={size}
                        onChange={(e) => setSize(e.target.value)}
                        options={SIZE_OPTIONS}
                      />
                      <Select
                        label="오류 보정 수준"
                        value={ecLevel}
                        onChange={(e) => setEcLevel(e.target.value)}
                        options={EC_OPTIONS}
                        hint="높을수록 손상돼도 잘 읽히지만 무늬가 촘촘해져요."
                      />
                      <ColorField label="QR 색상" value={darkColor} onChange={(e) => setDarkColor(e.target.value)} />
                      <ColorField label="배경 색상" value={lightColor} onChange={(e) => setLightColor(e.target.value)} />
                      <div className="sm:col-span-2">
                        <Button variant="secondary" size="sm" onClick={resetOptions}>기본값으로 되돌리기</Button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* 미리보기 영역 */}
              <div className="lg:border-l lg:border-slate-200 lg:pl-8">
                <QrPreview
                  url={valid ? url : ''}
                  size={size}
                  ecLevel={ecLevel}
                  darkColor={darkColor}
                  lightColor={lightColor}
                  margin={2}
                />
              </div>
            </div>

            <HistoryList items={history} onSelect={selectFromHistory} onClear={clearHistory} />
          </Card>

          <Footer />
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-50 via-slate-100 to-slate-200">
          <QrGeneratorPage />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
