<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두앱</title>

  <!-- ⚠️ CDN 은 모두 버전 고정. Babel 은 반드시 7.x -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

  <style>
    /* Tailwind 로 표현하기 어려운 것만 여기에 */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.18s ease-out; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ========================================
    // 📡 API 통신
    // ========================================
    //
    // 같은 서버(server.js)가 이 페이지도 서빙하므로 상대 경로면 충분하다.
    // localhost 주소를 하드코딩하면 배포했을 때 깨진다.

    const API_BASE_URL = '/api';

    async function api(endpoint, options = {}) {
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.success) {
        throw new Error(json.message || '요청을 처리하지 못했습니다.');
      }
      return json.data;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', className = '', ...props }) {
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 disabled:bg-indigo-300',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 disabled:text-slate-400',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 disabled:bg-rose-300',
        ghost: 'bg-transparent text-slate-500 hover:bg-slate-200 hover:text-slate-700',
      };
      const sizes = {
        sm: 'px-2.5 py-1 text-sm',
        md: 'px-4 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };
      return (
        <button
          className={`rounded-lg font-medium transition-colors disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        />
      );
    }

    // ref 를 받아 넘기려면 forwardRef 로 감싸야 한다 (입력창 포커스 이동에 필요)
    const Input = React.forwardRef(function Input({ className = '', ...props }, ref) {
      return (
        <input
          ref={ref}
          className={`w-full rounded-lg border border-slate-300 px-3.5 py-2 text-slate-800 placeholder-slate-400 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:bg-slate-100 ${className}`}
          {...props}
        />
      );
    });

    function Card({ className = '', children }) {
      return (
        <div className={`rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`rounded-full px-2.5 py-0.5 text-xs font-semibold ${className}`}>
          {children}
        </span>
      );
    }

    function Spinner({ className = '' }) {
      return (
        <span
          className={`inline-block h-4 w-4 animate-spin rounded-full border-2 border-slate-300 border-t-indigo-600 ${className}`}
          role="status"
          aria-label="불러오는 중"
        />
      );
    }

    // ========================================
    // 🧩 투두 전용 컴포넌트
    // ========================================

    function TodoForm({ onAdd, busy }) {
      const [title, setTitle] = useState('');
      const inputRef = useRef(null);

      async function handleSubmit(e) {
        e.preventDefault();
        const value = title.trim();
        if (!value || busy) return;

        const ok = await onAdd(value);
        if (ok) setTitle('');
        inputRef.current?.focus();
      }

      return (
        <form onSubmit={handleSubmit} className="flex gap-2">
          <Input
            ref={inputRef}
            value={title}
            onChange={(e) => setTitle(e.target.value)}
            placeholder="무엇을 해야 하나요?"
            maxLength={200}
            aria-label="할 일 입력"
          />
          <Button type="submit" disabled={!title.trim() || busy} className="shrink-0">
            추가
          </Button>
        </form>
      );
    }

    function TodoItem({ todo, onToggle, onRemove, onRename }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(todo.title);

      function startEdit() {
        setDraft(todo.title);
        setEditing(true);
      }

      async function commitEdit() {
        const value = draft.trim();
        setEditing(false);
        if (!value || value === todo.title) return;
        await onRename(todo.id, value);
      }

      return (
        <li className="animate-fade-in flex items-center gap-3 border-b border-slate-100 py-3 last:border-0">
          <input
            type="checkbox"
            checked={todo.done}
            onChange={() => onToggle(todo)}
            className="h-5 w-5 shrink-0 cursor-pointer rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
            aria-label={`${todo.title} 완료 표시`}
          />

          {editing ? (
            <Input
              value={draft}
              autoFocus
              maxLength={200}
              onChange={(e) => setDraft(e.target.value)}
              onBlur={commitEdit}
              onKeyDown={(e) => {
                if (e.key === 'Enter') commitEdit();
                if (e.key === 'Escape') setEditing(false);
              }}
              className="py-1"
              aria-label="할 일 수정"
            />
          ) : (
            <span
              onDoubleClick={startEdit}
              title="더블클릭하면 수정할 수 있어요"
              className={`flex-1 cursor-text break-all ${todo.done ? 'text-slate-400 line-through' : 'text-slate-800'}`}
            >
              {todo.title}
            </span>
          )}

          <Button
            variant="ghost"
            size="sm"
            onClick={() => onRemove(todo.id)}
            className="shrink-0 hover:text-rose-600"
            aria-label={`${todo.title} 삭제`}
          >
            삭제
          </Button>
        </li>
      );
    }

    function FilterTabs({ value, onChange, counts }) {
      const tabs = [
        { key: 'all', label: '전체', count: counts.all },
        { key: 'active', label: '진행 중', count: counts.active },
        { key: 'done', label: '완료', count: counts.done },
      ];
      return (
        <div className="flex gap-1 rounded-xl bg-slate-100 p-1" role="tablist">
          {tabs.map((tab) => (
            <button
              key={tab.key}
              role="tab"
              aria-selected={value === tab.key}
              onClick={() => onChange(tab.key)}
              className={`flex-1 rounded-lg px-3 py-1.5 text-sm font-medium transition ${
                value === tab.key
                  ? 'bg-white text-indigo-700 shadow-sm'
                  : 'text-slate-500 hover:text-slate-700'
              }`}
            >
              {tab.label} <span className="text-xs text-slate-400">{tab.count}</span>
            </button>
          ))}
        </div>
      );
    }

    function EmptyState({ filter }) {
      const messages = {
        all: '아직 할 일이 없어요. 위에서 첫 번째 할 일을 추가해 보세요.',
        active: '진행 중인 할 일이 없어요. 전부 끝냈네요! 🎉',
        done: '완료한 할 일이 아직 없어요.',
      };
      return (
        <p className="py-12 text-center text-sm text-slate-400">{messages[filter]}</p>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [todos, setTodos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState(null);
      const [filter, setFilter] = useState('all');

      // ── 목록 불러오기 ──
      const loadTodos = useCallback(async () => {
        try {
          setError(null);
          const data = await api('/todos');
          setTodos(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { loadTodos(); }, [loadTodos]);

      // ── 조작 핸들러 ──
      async function addTodo(title) {
        setBusy(true);
        try {
          setError(null);
          const created = await api('/todos', {
            method: 'POST',
            body: JSON.stringify({ title }),
          });
          setTodos((prev) => [created, ...prev]);
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        } finally {
          setBusy(false);
        }
      }

      async function toggleTodo(todo) {
        // 먼저 화면을 바꾸고(낙관적 업데이트), 실패하면 되돌린다
        const prev = todos;
        setTodos((list) => list.map((t) => (t.id === todo.id ? { ...t, done: !t.done } : t)));
        try {
          setError(null);
          await api(`/todos/${todo.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ done: !todo.done }),
          });
        } catch (err) {
          setError(err.message);
          setTodos(prev);
        }
      }

      async function renameTodo(id, title) {
        const prev = todos;
        setTodos((list) => list.map((t) => (t.id === id ? { ...t, title } : t)));
        try {
          setError(null);
          await api(`/todos/${id}`, { method: 'PATCH', body: JSON.stringify({ title }) });
        } catch (err) {
          setError(err.message);
          setTodos(prev);
        }
      }

      async function removeTodo(id) {
        const prev = todos;
        setTodos((list) => list.filter((t) => t.id !== id));
        try {
          setError(null);
          await api(`/todos/${id}`, { method: 'DELETE' });
        } catch (err) {
          setError(err.message);
          setTodos(prev);
        }
      }

      async function clearCompleted() {
        const prev = todos;
        setTodos((list) => list.filter((t) => !t.done));
        try {
          setError(null);
          await api('/todos/completed', { method: 'DELETE' });
        } catch (err) {
          setError(err.message);
          setTodos(prev);
        }
      }

      // ── 파생 상태 ──
      const counts = useMemo(() => ({
        all: todos.length,
        active: todos.filter((t) => !t.done).length,
        done: todos.filter((t) => t.done).length,
      }), [todos]);

      const visibleTodos = useMemo(() => {
        if (filter === 'active') return todos.filter((t) => !t.done);
        if (filter === 'done') return todos.filter((t) => t.done);
        return todos;
      }, [todos, filter]);

      return (
        <div className="mx-auto min-h-screen w-full max-w-2xl px-4 py-10 sm:py-16">
          <header className="mb-6">
            <h1 className="text-3xl font-bold text-slate-900">할 일 목록</h1>
            <p className="mt-1 text-sm text-slate-500">
              PostgreSQL 에 저장돼서 서버를 껐다 켜도 그대로 남아 있어요.
            </p>
          </header>

          <Card>
            <TodoForm onAdd={addTodo} busy={busy} />

            <div className="mt-5">
              <FilterTabs value={filter} onChange={setFilter} counts={counts} />
            </div>

            {error && (
              <div className="mt-4 flex items-center justify-between gap-3 rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700" role="alert">
                <span>{error}</span>
                <Button variant="ghost" size="sm" onClick={loadTodos} className="shrink-0 text-rose-600">
                  다시 시도
                </Button>
              </div>
            )}

            {loading ? (
              <div className="flex items-center justify-center gap-2 py-12 text-sm text-slate-400">
                <Spinner /> 불러오는 중…
              </div>
            ) : visibleTodos.length === 0 ? (
              <EmptyState filter={filter} />
            ) : (
              <ul className="mt-2">
                {visibleTodos.map((todo) => (
                  <TodoItem
                    key={todo.id}
                    todo={todo}
                    onToggle={toggleTodo}
                    onRemove={removeTodo}
                    onRename={renameTodo}
                  />
                ))}
              </ul>
            )}

            {!loading && todos.length > 0 && (
              <footer className="mt-4 flex items-center justify-between border-t border-slate-100 pt-4">
                <Badge className="bg-indigo-50 text-indigo-700">
                  남은 할 일 {counts.active}개
                </Badge>
                <Button
                  variant="secondary"
                  size="sm"
                  onClick={clearCompleted}
                  disabled={counts.done === 0}
                >
                  완료한 항목 비우기
                </Button>
              </footer>
            )}
          </Card>

          <p className="mt-4 text-center text-xs text-slate-400">
            할 일을 더블클릭하면 내용을 수정할 수 있어요.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
